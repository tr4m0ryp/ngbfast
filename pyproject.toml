[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbfast"
version = "0.1.0"
description = "Bit-identical faster prediction for NGBoost: one input check per call with direct tree traversal, a warning when every tree is constant, and folding of constant learners"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Moussa Ouallaf", email = "moussa@husimi.ai" }]
requires-python = ">=3.10"
dependencies = [
    "ngboost>=0.5.11,<0.6",
    "numpy>=1.24",
    "scikit-learn>=1.6",
]
keywords = ["ngboost", "gradient boosting", "probabilistic prediction", "inference", "constant folding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ngbfast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: latency checks that take a few seconds"]
